      - ./node2/key:/var/lib/besu/key
      - ./node2/vrf-private-key.pk8:/var/lib/besu/vrf-private-key.pk8
      - ./node2/vrf-public-key.x509:/var/lib/besu/vrf-public-key.x509
    command: *besu-command
    ports:
      - "8546:8545"
      - "9546:9545"
    networks:
      besu-net:
        ipv4_address: 172.28.0.12

