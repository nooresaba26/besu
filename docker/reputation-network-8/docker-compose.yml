services:

  node1:
    image: custom-besu-reputation:1.0
    container_name: besu-node1
    environment:
      BESU_REPUTATION_CONTRACT_ADDRESS: ${REPUTATION_CONTRACT_ADDRESS}
    volumes:
      - ./genesis.json:/network/genesis.json:ro
      - ./static-nodes.json:/var/lib/besu/static-nodes.json
      - ./node1/key:/var/lib/besu/key
      - ./node1/vrf-private-key.pk8:/var/lib/besu/vrf-private-key.pk8
      - ./node1/vrf-public-key.x509:/var/lib/besu/vrf-public-key.x509
    command: &besu-command
      - --data-path=/var/lib/besu
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --min-gas-price=0
      - --sync-min-peers=0
      - --tx-pool-max-future-by-sender=2000
    ports:
      - "8545:8545"
      - "9545:9545"
    networks:
      besu-net:
        ipv4_address: 172.28.0.11

  node2:
    image: custom-besu-reputation:1.0
    container_name: besu-node2
    environment:
      BESU_REPUTATION_CONTRACT_ADDRESS: ${REPUTATION_CONTRACT_ADDRESS}
